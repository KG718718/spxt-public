name: Public candidate checks
on:
  push:
    branches: [codex/public-v1]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-core:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - name: Synthetic core and startup checks
        run: node tools/tests/run-public-tests.js
      - name: Collect original third-party license notices
        run: node tools/check-public-licenses.js
      - name: Preserve third-party license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-license-evidence
          path: .test-work/license-report
          if-no-files-found: error
          retention-days: 30
      - name: Preserve installation UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-install-login-ui-evidence
          path: .test-work/login-browser-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Preserve full application browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-application-ui-evidence
          path: .test-work/full-ui-evidence
          if-no-files-found: error
          retention-days: 30
