name: Runtime R5A hosted safety gate
on:
  push:
    branches: [codex/windows-installer-v1.1]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-r5a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.ref == 'refs/heads/codex/windows-installer-v1.1'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: File and directory symlink preflight (no skips)
        run: node tools/tests/windows-runtime/hosted-gate.cjs preflight
      - name: Fresh locked dependencies (reviewed optional omission)
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: All unchanged public suites and exact counts
        run: node tools/tests/windows-runtime/hosted-gate.cjs regression
      - name: Runtime safety guard checks
        run: node tools/tests/windows-runtime/guards.test.cjs
      - name: Preserve gate evidence only, not instances or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-r5a-gate
          path: .test-work/r5a-gate/
          if-no-files-found: error
          retention-days: 30
