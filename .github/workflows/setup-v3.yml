name: Setup Batch 4 upgrade candidate
on:
  push:
    branches: [codex/windows-installer-v1.1]
    paths:
      - 'tools/windows-installer/**'
      - 'tools/tests/windows-installer/**'
      - 'tools/windows-launcher/**'
      - '.github/workflows/setup-v3.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Run an identity, LAN identity capture, closed upgrade-fault sequence, historical static QA, full Setup, or LAN Host workflow
        required: false
        default: identity
        type: choice
        options:
          - identity
          - lan-identity
          - sequence
          - qa-static
          - full
          - lan-diagnostic
          - lan-diagnostic-extension
          - lan-hosted-diagnostic
          - lan-full
          - lan-qa
permissions:
  contents: read
concurrency:
  group: setup-3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/codex/windows-installer-v1.1' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[identity-diagnostic]') && !contains(github.event.head_commit.message, '[sequence-diagnostic]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full'))
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same-commit fresh Runtime, Launcher, Portable and Setup
        shell: pwsh
        run: |
          if (!(Test-Path E:/)) {
            $taskDrive=Join-Path $env:RUNNER_TEMP 'ksession-setup-e'
            New-Item -ItemType Directory -Path $taskDrive | Out-Null
            subst E: $taskDrive
            if ($LASTEXITCODE -ne 0) { throw 'E isolation unavailable' }
          }
          git clone --no-hardlinks --no-checkout . E:/setup-source
          if ($LASTEXITCODE -ne 0) { throw 'Isolated source clone failed' }
          git -C E:/setup-source -c core.autocrlf=false checkout --detach ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Exact checkout failed' }
          git clone --no-hardlinks --no-checkout . E:/beta1-source
          if ($LASTEXITCODE -ne 0) { throw 'Isolated beta.1 source clone failed' }
          git -C E:/beta1-source -c core.autocrlf=false checkout --detach e9417f036d0cdf736ff84682556a994040f0de0b
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 checkout failed' }
          if ((git -C E:/beta1-source rev-parse HEAD) -ne 'e9417f036d0cdf736ff84682556a994040f0de0b' -or
              (git -C E:/beta1-source rev-parse 'HEAD^{tree}') -ne '5da66cb9b73dfa307948634634bfab2cfaaead12') { throw 'beta.1 source identity mismatch' }
          & E:/setup-source/tools/windows-installer/rebuild-beta1.ps1 -Source E:/beta1-source -Work E:/beta1-build
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 build-only failed' }
          $taskNode='E:/beta1-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskHistorical='E:/setup-source/tools/windows-installer/historical-identity/historical-run-35514357007-evidence.json'
          $taskBundle='E:/fresh-beta1-approved-identity-bundle.json'
          & $taskNode E:/setup-source/tools/windows-installer/fresh-identity.cjs E:/beta1-build $taskHistorical $taskBundle
          if ($LASTEXITCODE -ne 0) { throw 'Fresh beta.1 identity bundle generation failed' }
          $env:KSESSION_APPROVED_IDENTITY_BUNDLE=$taskBundle
          $env:KSESSION_BETA1_SETUP='E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe'
          "KSESSION_APPROVED_IDENTITY_BUNDLE=$taskBundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KSESSION_BETA1_SETUP=E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & E:/setup-source/tools/windows-installer/ci.ps1 -Work E:/setup-build -Commit ${{ github.sha }}
      - name: Same-commit full public regression
        shell: pwsh
        run: |
          $taskNode='E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskNpm='E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node_modules/npm/bin/npm-cli.js'
          $env:TEMP='E:/setup-build/regression-temp';$env:TMP=$env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP|Out-Null
          Set-Location E:/setup-source
          & $taskNode tools/tests/windows-runtime/hosted-gate.cjs preflight
          if ($LASTEXITCODE -ne 0){throw 'Symlink gate failed'}
          & $taskNode $taskNpm ci --omit=optional --ignore-scripts --no-audit --no-fund --cache E:/setup-build/regression-cache
          if ($LASTEXITCODE -ne 0){throw 'Regression dependency setup failed'}
          & $taskNode tools/tests/windows-runtime/hosted-gate.cjs regression
          if ($LASTEXITCODE -ne 0){throw 'Regression failed; retain evidence, do not automatically retry'}
          $taskR=Get-Content -Raw .test-work/r5a-gate/regression.json|ConvertFrom-Json
          if($taskR.testTotal -ne 742 -or $taskR.suitePass -ne 26 -or $taskR.fail -ne 0 -or $taskR.skipped -ne 0){throw 'Exact regression count failed'}
          Copy-Item .test-work/r5a-gate/regression.json E:/setup-build/candidate/artifact/public-regression.json
      - name: Artifact privacy and identity allowlist
        shell: pwsh
        run: |
          & E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node.exe E:/setup-source/tools/windows-installer/verify-artifact.cjs E:/setup-build/candidate/artifact ${{ github.sha }}
          if ($LASTEXITCODE -ne 0){throw 'Artifact preflight failed'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: K-SESSION-setup-win-x64-${{ github.sha }}
          path: E:/setup-build/candidate/artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve non-sensitive failure summaries
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: setup-failure-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            E:/setup-build/installer-tests/INSTALLER-TEST-REPORT.json
            E:/setup-build/upgrade-tests/UPGRADE-TEST-REPORT.json
            E:/fresh-beta1-approved-identity-bundle.json
            E:/beta1-build/BETA1-BUILD-ONLY-REPORT.json
            E:/beta1-build/candidate/artifact/build-info.json
            E:/beta1-build/candidate/artifact/installer-manifest.json
            E:/setup-build/offline-gate/offline-network.json
            E:/setup-build/candidate/compiler.stdout.log
            E:/setup-build/candidate/compiler.stderr.log
            E:/setup-build/fault-space/compiler.stderr.log
            E:/setup-build/fault-cancel/compiler.stderr.log
            E:/setup-build/fault-copy/compiler.stderr.log
            E:/setup-build/fault-payload-hash/compiler.stderr.log
            E:/setup-build/fault-post-copy/compiler.stderr.log
            E:/setup-source/.test-work/r5a-gate/regression.json
          if-no-files-found: warn
          retention-days: 30
  identity:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1' && github.event_name == 'workflow_dispatch' && (inputs.mode == '' || inputs.mode == 'identity')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact fresh beta.1 identity only
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Tested commit mismatch' }
          if (!(Test-Path E:/)) {
            $taskDrive=Join-Path $env:RUNNER_TEMP 'ksession-identity-e'
            New-Item -ItemType Directory -Path $taskDrive|Out-Null
            subst E: $taskDrive
            if ($LASTEXITCODE -ne 0) { throw 'E isolation unavailable' }
          }
          git clone --no-hardlinks --no-checkout . E:/beta1-source *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Isolated beta.1 source clone failed' }
          git -C E:/beta1-source -c core.autocrlf=false checkout --detach e9417f036d0cdf736ff84682556a994040f0de0b *> $null
          if ($LASTEXITCODE -ne 0 -or (git -C E:/beta1-source rev-parse HEAD) -ne 'e9417f036d0cdf736ff84682556a994040f0de0b' -or
              (git -C E:/beta1-source rev-parse 'HEAD^{tree}') -ne '5da66cb9b73dfa307948634634bfab2cfaaead12') { throw 'beta.1 source identity mismatch' }
          & ./tools/windows-installer/rebuild-beta1.ps1 -Source E:/beta1-source -Work E:/beta1-build *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 build-only failed' }
          $taskNode='E:/beta1-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskBundle='E:/fresh-beta1-approved-identity-bundle.json'
          & $taskNode ./tools/windows-installer/fresh-identity.cjs E:/beta1-build ./tools/windows-installer/historical-identity/historical-run-35514357007-evidence.json $taskBundle *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Approved identity bundle generation failed' }
          & ./tools/windows-installer/identity-diagnostic.ps1 -Work E:/identity-diagnostic -Beta1Setup E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe -Bundle $taskBundle -Node $taskNode
          if ($LASTEXITCODE -ne 0) { throw 'Identity diagnostic failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: identity-gate-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: E:/identity-diagnostic/IDENTITY-DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 30
      - name: Fixed summary only
        if: always()
        shell: pwsh
        run: |
          $taskReport=Get-Content -LiteralPath E:/identity-diagnostic/IDENTITY-DIAGNOSTIC.json -Raw|ConvertFrom-Json
          if($taskReport.reason -notmatch '^IDENTITY_(ACCEPTED|REGISTRATION|BINDING|PATH|MANIFEST|PROGRAM|BUILD|RUNTIME|LAUNCHER|INTERNAL)$'){throw 'Unsafe identity diagnostic reason'}
          "Identity diagnostic: $($taskReport.reason)" >> $env:GITHUB_STEP_SUMMARY
  sequence:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1' && github.event_name == 'workflow_dispatch' && inputs.mode == 'sequence'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact beta.1 closed upgrade-fault sequence only
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Tested commit mismatch' }
          if (!(Test-Path E:/)) {
            $taskDrive=Join-Path $env:RUNNER_TEMP 'ksession-sequence-e'
            New-Item -ItemType Directory -Path $taskDrive|Out-Null
            subst E: $taskDrive
            if ($LASTEXITCODE -ne 0) { throw 'E isolation unavailable' }
          }
          git clone --no-hardlinks --no-checkout . E:/beta1-source *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Isolated beta.1 source clone failed' }
          git -C E:/beta1-source -c core.autocrlf=false checkout --detach e9417f036d0cdf736ff84682556a994040f0de0b *> $null
          if ($LASTEXITCODE -ne 0 -or (git -C E:/beta1-source rev-parse HEAD) -ne 'e9417f036d0cdf736ff84682556a994040f0de0b' -or
              (git -C E:/beta1-source rev-parse 'HEAD^{tree}') -ne '5da66cb9b73dfa307948634634bfab2cfaaead12') { throw 'beta.1 source identity mismatch' }
          & ./tools/windows-installer/rebuild-beta1.ps1 -Source E:/beta1-source -Work E:/beta1-build *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 build-only failed' }
          $taskNode='E:/beta1-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskBundle='E:/fresh-beta1-approved-identity-bundle.json'
          & $taskNode ./tools/windows-installer/fresh-identity.cjs E:/beta1-build ./tools/windows-installer/historical-identity/historical-run-35514357007-evidence.json $taskBundle *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Approved identity bundle generation failed' }
          & ./tools/windows-installer/sequence-diagnostic.ps1 -Work E:/sequence-diagnostic -Beta1Build E:/beta1-build -Bundle $taskBundle -Node $taskNode -Commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Sequence diagnostic failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: upgrade-sequence-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: E:/sequence-diagnostic/SEQUENCE-DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 30
      - name: Fixed sequence summary only
        if: always()
        shell: pwsh
        run: |
          . ./tools/windows-installer/sequence-diagnostic-report.ps1
          $taskReport=Get-Content -LiteralPath E:/sequence-diagnostic/SEQUENCE-DIAGNOSTIC.json -Raw|ConvertFrom-Json
          Test-KSessionSequenceReport -Report $taskReport
          "Sequence diagnostic: $($taskReport.status)" >> $env:GITHUB_STEP_SUMMARY
          foreach($taskPhase in $taskReport.phases){
            "- $($taskPhase.phase): $($taskPhase.result) / $($taskPhase.state)" >> $env:GITHUB_STEP_SUMMARY
          }
  qa-static:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1' && github.event_name == 'workflow_dispatch' && inputs.mode == 'qa-static'
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Historical identity static gate only
        shell: pwsh
        run: |
          $taskReport=Join-Path $env:RUNNER_TEMP 'historical-static-gate.json'
          & ./tools/windows-installer/historical-identity/static-gate.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ReportPath $taskReport -SourceCommit '${{ github.sha }}'
          $taskExit=$LASTEXITCODE
          . ./tools/windows-installer/historical-identity/static-gate-report.ps1
          $taskEvidence=Get-Content -LiteralPath $taskReport -Raw|ConvertFrom-Json
          Test-KSessionHistoricalStaticGateReport -Report $taskEvidence -ExpectedCommit '${{ github.sha }}'
          "KSESSION_HISTORICAL_STATIC_REPORT=$taskReport" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if($taskExit -ne 0 -or $taskEvidence.status -cne 'PASS'){throw 'Historical identity static gate failed'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: historical-identity-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KSESSION_HISTORICAL_STATIC_REPORT }}
          if-no-files-found: error
          retention-days: 30
      - name: Fixed historical static summary only
        if: always()
        shell: pwsh
        run: |
          $taskReport=Get-Content -LiteralPath $env:KSESSION_HISTORICAL_STATIC_REPORT -Raw|ConvertFrom-Json
          . ./tools/windows-installer/historical-identity/static-gate-report.ps1
          Test-KSessionHistoricalStaticGateReport -Report $taskReport -ExpectedCommit '${{ github.sha }}'
          "Historical identity static gate: $($taskReport.status)" >> $env:GITHUB_STEP_SUMMARY
  lan-identity:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/lan-host-v1.1' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lan-identity'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize fixed beta.2 identity report
        shell: pwsh
        run: |
          $taskOutput=Join-Path $env:RUNNER_TEMP 'b45-beta2-identity-output'
          if (Test-Path -LiteralPath $taskOutput) { throw 'Identity output already exists' }
          New-Item -ItemType Directory -Path $taskOutput | Out-Null
          $taskReport=Join-Path $taskOutput 'BETA2-IDENTITY-REPORT.json'
          $taskEvidence=Join-Path $taskOutput 'beta2-identity-evidence.json'
          $taskValue=[ordered]@{schema=1;kind='k-session-beta2-identity-run';status='BLOCKED';stage='STATIC_GATE';reason='BLOCKED_STATIC_GATE';source=[ordered]@{repository='KG718718/spxt-public';runId=[Int64]36246132535;artifactId=[Int64]10907910968;headSha='c8886e6b6d413c2fd73d6716621d07a80b337e58'};testedCommit='${{ github.sha }}'}
          [IO.File]::WriteAllText($taskReport,($taskValue|ConvertTo-Json -Depth 4 -Compress)+"`n",[Text.UTF8Encoding]::new($false))
          "KSESSION_BETA2_IDENTITY_OUTPUT=$taskOutput" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KSESSION_BETA2_IDENTITY_REPORT=$taskReport" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KSESSION_BETA2_IDENTITY_EVIDENCE=$taskEvidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Static and synthetic beta.2 identity gates
        shell: pwsh
        run: |
          $taskHead=git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $taskHead -cne '${{ github.sha }}') { throw 'Tested commit mismatch' }
          node --check tools/windows-installer/beta2-identity/index.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Identity module syntax failed' }
          node --check tools/windows-installer/beta2-identity/cli.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Identity CLI syntax failed' }
          node --test tools/tests/windows-installer/beta2-identity/beta2-identity.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Identity synthetic gate failed' }
          & tools/tests/windows-installer/beta2-identity/setup-process.test.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Identity process gate failed' }
          $taskValue=[ordered]@{schema=1;kind='k-session-beta2-identity-run';status='BLOCKED';stage='HOSTED_PREFLIGHT';reason='BLOCKED_HOSTED_PREFLIGHT';source=[ordered]@{repository='KG718718/spxt-public';runId=[Int64]36246132535;artifactId=[Int64]10907910968;headSha='c8886e6b6d413c2fd73d6716621d07a80b337e58'};testedCommit='${{ github.sha }}'}
          [IO.File]::WriteAllText($env:KSESSION_BETA2_IDENTITY_REPORT,($taskValue|ConvertTo-Json -Depth 4 -Compress)+"`n",[Text.UTF8Encoding]::new($false))
      - name: Install accepted F3 beta.2 and capture exact post-install identity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & pwsh -NoLogo -NoProfile -File tools/windows-installer/beta2-identity/invoke.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $env:KSESSION_BETA2_IDENTITY_OUTPUT -TestedCommit '${{ github.sha }}'
          $taskExit=$LASTEXITCODE
          if ($taskExit -ne 0) { throw 'Beta.2 identity capture blocked' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: b45-beta2-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.KSESSION_BETA2_IDENTITY_REPORT }}
            ${{ env.KSESSION_BETA2_IDENTITY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
      - name: Fixed beta.2 identity summary only
        if: always()
        shell: pwsh
        run: |
          node tools/windows-installer/beta2-identity/cli.cjs verify-report --input $env:KSESSION_BETA2_IDENTITY_REPORT
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe beta.2 identity report' }
          $taskReport=Get-Content -LiteralPath $env:KSESSION_BETA2_IDENTITY_REPORT -Raw | ConvertFrom-Json
          "Beta.2 identity capture: $($taskReport.status) / $($taskReport.stage) / $($taskReport.reason)" >> $env:GITHUB_STEP_SUMMARY
  lan-hosted-diagnostic:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/lan-host-v1.1' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lan-hosted-diagnostic'
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Initialize isolated Hosted LAN report path
        shell: pwsh
        run: |
          $taskReport=Join-Path $env:RUNNER_TEMP 'hosted-lan-gate.json'
          if(Test-Path -LiteralPath $taskReport){throw 'Hosted LAN report path is not fresh'}
          "KSESSION_HOSTED_LAN_REPORT=$taskReport" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Isolated Hosted LAN fixed-stage gate
        shell: pwsh
        run: |
          node tools/tests/lan-host/hosted-gate.cjs $env:KSESSION_HOSTED_LAN_REPORT
          $taskExit=$LASTEXITCODE
          node tools/tests/lan-host/hosted-gate.cjs verify-report $env:KSESSION_HOSTED_LAN_REPORT '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Unsafe Hosted LAN diagnostic report'}
          if($taskExit -ne 0){throw 'Hosted LAN fixed-stage gate failed'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-lan-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.KSESSION_HOSTED_LAN_REPORT }}
          if-no-files-found: error
          retention-days: 30
      - name: Fixed Hosted LAN summary only
        if: always()
        shell: pwsh
        run: |
          node tools/tests/lan-host/hosted-gate.cjs verify-report $env:KSESSION_HOSTED_LAN_REPORT '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Unsafe Hosted LAN diagnostic report'}
          $taskReport=Get-Content -LiteralPath $env:KSESSION_HOSTED_LAN_REPORT -Raw|ConvertFrom-Json
          "Hosted LAN diagnostic: $($taskReport.status) / $($taskReport.stage) / $($taskReport.reason)" >> $env:GITHUB_STEP_SUMMARY
  lan-host-v1-1:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/lan-host-v1.1' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'lan-diagnostic' || inputs.mode == 'lan-diagnostic-extension' || inputs.mode == 'lan-full' || inputs.mode == 'lan-qa')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/lan-host-v1.1.yml
    with:
      mode: ${{ inputs.mode == 'lan-diagnostic' && 'diagnostic' || inputs.mode == 'lan-diagnostic-extension' && 'diagnostic-extension' || inputs.mode == 'lan-full' && 'full' || 'qa' }}
  historical-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Static and synthetic historical identity gates
        shell: pwsh
        run: |
          $taskReport=Join-Path $env:RUNNER_TEMP 'historical-static-gate.json'
          & ./tools/windows-installer/historical-identity/static-gate.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ReportPath $taskReport -SourceCommit '${{ github.sha }}'
          $taskExit=$LASTEXITCODE
          . ./tools/windows-installer/historical-identity/static-gate-report.ps1
          $taskEvidence=Get-Content -LiteralPath $taskReport -Raw|ConvertFrom-Json
          Test-KSessionHistoricalStaticGateReport -Report $taskEvidence -ExpectedCommit '${{ github.sha }}'
          if($taskExit -ne 0 -or $taskEvidence.status -cne 'PASS'){throw 'Historical identity static gate failed'}
      - name: Install historical beta.1 and capture exact post-install identity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $taskOutput='C:/KSESSION-B4-T1A-EVIDENCE/historical-identity-evidence.json'
          & tools/windows-installer/historical-identity/invoke.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -OutputFile $taskOutput
          if ($LASTEXITCODE -ne 0) { throw 'Historical identity capture blocked' }
          "KSESSION_HISTORICAL_EVIDENCE=$taskOutput" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Non-sensitive historical identity summary
        if: success()
        shell: pwsh
        run: |
          $e=Get-Content -LiteralPath $env:KSESSION_HISTORICAL_EVIDENCE -Raw|ConvertFrom-Json
          @(
            '## Historical beta.1 identity evidence',
            '',
            ('- Status: '+$e.status),
            ('- Profile: '+$e.profile.id),
            ('- Run / Artifact: '+$e.source.runId+' / '+$e.source.artifactId),
            ('- Setup SHA-256: `'+$e.source.setupSha256+'`'),
            ('- T1 single-policy validation: '+$e.verification.t1SinglePolicy),
            ('- Registry view: '+$e.verification.registryView),
            ('- Cleanup: PASS')
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: b4-historical-identity-evidence-${{ github.sha }}
          path: ${{ env.KSESSION_HISTORICAL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
