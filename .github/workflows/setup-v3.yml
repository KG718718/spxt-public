name: Setup Batch 4 upgrade candidate
on:
  push:
    branches: [codex/windows-installer-v1.1]
    paths:
      - 'tools/windows-installer/**'
      - 'tools/tests/windows-installer/**'
      - 'tools/windows-launcher/**'
      - '.github/workflows/setup-v3.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Run the identity stop-loss diagnostic or the full Setup workflow
        required: false
        default: identity
        type: choice
        options:
          - identity
          - full
permissions:
  contents: read
concurrency:
  group: setup-3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/codex/windows-installer-v1.1' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[identity-diagnostic]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full'))
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same-commit fresh Runtime, Launcher, Portable and Setup
        shell: pwsh
        run: |
          if (!(Test-Path E:/)) {
            $taskDrive=Join-Path $env:RUNNER_TEMP 'ksession-setup-e'
            New-Item -ItemType Directory -Path $taskDrive | Out-Null
            subst E: $taskDrive
            if ($LASTEXITCODE -ne 0) { throw 'E isolation unavailable' }
          }
          git clone --no-hardlinks --no-checkout . E:/setup-source
          if ($LASTEXITCODE -ne 0) { throw 'Isolated source clone failed' }
          git -C E:/setup-source -c core.autocrlf=false checkout --detach ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Exact checkout failed' }
          git clone --no-hardlinks --no-checkout . E:/beta1-source
          if ($LASTEXITCODE -ne 0) { throw 'Isolated beta.1 source clone failed' }
          git -C E:/beta1-source -c core.autocrlf=false checkout --detach e9417f036d0cdf736ff84682556a994040f0de0b
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 checkout failed' }
          if ((git -C E:/beta1-source rev-parse HEAD) -ne 'e9417f036d0cdf736ff84682556a994040f0de0b' -or
              (git -C E:/beta1-source rev-parse 'HEAD^{tree}') -ne '5da66cb9b73dfa307948634634bfab2cfaaead12') { throw 'beta.1 source identity mismatch' }
          & E:/setup-source/tools/windows-installer/rebuild-beta1.ps1 -Source E:/beta1-source -Work E:/beta1-build
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 build-only failed' }
          $taskNode='E:/beta1-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskHistorical='E:/setup-source/tools/windows-installer/historical-identity/historical-run-35514357007-evidence.json'
          $taskBundle='E:/fresh-beta1-approved-identity-bundle.json'
          & $taskNode E:/setup-source/tools/windows-installer/fresh-identity.cjs E:/beta1-build $taskHistorical $taskBundle
          if ($LASTEXITCODE -ne 0) { throw 'Fresh beta.1 identity bundle generation failed' }
          $env:KSESSION_APPROVED_IDENTITY_BUNDLE=$taskBundle
          $env:KSESSION_BETA1_SETUP='E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe'
          "KSESSION_APPROVED_IDENTITY_BUNDLE=$taskBundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KSESSION_BETA1_SETUP=E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & E:/setup-source/tools/windows-installer/ci.ps1 -Work E:/setup-build -Commit ${{ github.sha }}
      - name: Same-commit full public regression
        shell: pwsh
        run: |
          $taskNode='E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskNpm='E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node_modules/npm/bin/npm-cli.js'
          $env:TEMP='E:/setup-build/regression-temp';$env:TMP=$env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP|Out-Null
          Set-Location E:/setup-source
          & $taskNode tools/tests/windows-runtime/hosted-gate.cjs preflight
          if ($LASTEXITCODE -ne 0){throw 'Symlink gate failed'}
          & $taskNode $taskNpm ci --omit=optional --ignore-scripts --no-audit --no-fund --cache E:/setup-build/regression-cache
          if ($LASTEXITCODE -ne 0){throw 'Regression dependency setup failed'}
          & $taskNode tools/tests/windows-runtime/hosted-gate.cjs regression
          if ($LASTEXITCODE -ne 0){throw 'Regression failed; retain evidence, do not automatically retry'}
          $taskR=Get-Content -Raw .test-work/r5a-gate/regression.json|ConvertFrom-Json
          if($taskR.testTotal -ne 742 -or $taskR.suitePass -ne 26 -or $taskR.fail -ne 0 -or $taskR.skipped -ne 0){throw 'Exact regression count failed'}
          Copy-Item .test-work/r5a-gate/regression.json E:/setup-build/candidate/artifact/public-regression.json
      - name: Artifact privacy and identity allowlist
        shell: pwsh
        run: |
          & E:/setup-build/portable/node-tool/node-v24.21.0-win-x64/node.exe E:/setup-source/tools/windows-installer/verify-artifact.cjs E:/setup-build/candidate/artifact ${{ github.sha }}
          if ($LASTEXITCODE -ne 0){throw 'Artifact preflight failed'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: K-SESSION-setup-win-x64-${{ github.sha }}
          path: E:/setup-build/candidate/artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve non-sensitive failure summaries
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: setup-failure-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            E:/setup-build/installer-tests/INSTALLER-TEST-REPORT.json
            E:/setup-build/upgrade-tests/UPGRADE-TEST-REPORT.json
            E:/fresh-beta1-approved-identity-bundle.json
            E:/beta1-build/BETA1-BUILD-ONLY-REPORT.json
            E:/beta1-build/candidate/artifact/build-info.json
            E:/beta1-build/candidate/artifact/installer-manifest.json
            E:/setup-build/offline-gate/offline-network.json
            E:/setup-build/candidate/compiler.stdout.log
            E:/setup-build/candidate/compiler.stderr.log
            E:/setup-build/fault-space/compiler.stderr.log
            E:/setup-build/fault-cancel/compiler.stderr.log
            E:/setup-build/fault-copy/compiler.stderr.log
            E:/setup-build/fault-payload-hash/compiler.stderr.log
            E:/setup-build/fault-post-copy/compiler.stderr.log
            E:/setup-source/.test-work/r5a-gate/regression.json
          if-no-files-found: warn
          retention-days: 30
  identity:
    if: github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1' && github.event_name == 'workflow_dispatch' && (inputs.mode == '' || inputs.mode == 'identity')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact fresh beta.1 identity only
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Tested commit mismatch' }
          if (!(Test-Path E:/)) {
            $taskDrive=Join-Path $env:RUNNER_TEMP 'ksession-identity-e'
            New-Item -ItemType Directory -Path $taskDrive|Out-Null
            subst E: $taskDrive
            if ($LASTEXITCODE -ne 0) { throw 'E isolation unavailable' }
          }
          git clone --no-hardlinks --no-checkout . E:/beta1-source *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Isolated beta.1 source clone failed' }
          git -C E:/beta1-source -c core.autocrlf=false checkout --detach e9417f036d0cdf736ff84682556a994040f0de0b *> $null
          if ($LASTEXITCODE -ne 0 -or (git -C E:/beta1-source rev-parse HEAD) -ne 'e9417f036d0cdf736ff84682556a994040f0de0b' -or
              (git -C E:/beta1-source rev-parse 'HEAD^{tree}') -ne '5da66cb9b73dfa307948634634bfab2cfaaead12') { throw 'beta.1 source identity mismatch' }
          & ./tools/windows-installer/rebuild-beta1.ps1 -Source E:/beta1-source -Work E:/beta1-build *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Exact beta.1 build-only failed' }
          $taskNode='E:/beta1-build/portable/node-tool/node-v24.21.0-win-x64/node.exe'
          $taskBundle='E:/fresh-beta1-approved-identity-bundle.json'
          & $taskNode ./tools/windows-installer/fresh-identity.cjs E:/beta1-build ./tools/windows-installer/historical-identity/historical-run-35514357007-evidence.json $taskBundle *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Approved identity bundle generation failed' }
          & ./tools/windows-installer/identity-diagnostic.ps1 -Work E:/identity-diagnostic -Beta1Setup E:/beta1-build/candidate/artifact/K-SESSION-Setup-1.1.0-beta.1.exe -Bundle $taskBundle -Node $taskNode
          if ($LASTEXITCODE -ne 0) { throw 'Identity diagnostic failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: identity-gate-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: E:/identity-diagnostic/IDENTITY-DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 30
      - name: Fixed summary only
        if: always()
        shell: pwsh
        run: |
          $taskReport=Get-Content -LiteralPath E:/identity-diagnostic/IDENTITY-DIAGNOSTIC.json -Raw|ConvertFrom-Json
          if($taskReport.reason -notmatch '^IDENTITY_(ACCEPTED|REGISTRATION|BINDING|PATH|MANIFEST|PROGRAM|BUILD|RUNTIME|LAUNCHER|INTERNAL)$'){throw 'Unsafe identity diagnostic reason'}
          "Identity diagnostic: $($taskReport.reason)" >> $env:GITHUB_STEP_SUMMARY
  historical-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && github.repository == 'KG718718/spxt-public' && github.ref == 'refs/heads/codex/windows-installer-v1.1'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Exact public Git bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Static and synthetic historical identity gates
        shell: pwsh
        run: |
          node --check tools/windows-installer/historical-identity/index.cjs
          node --check tools/windows-installer/historical-identity/cli.cjs
          node --test tools/tests/windows-installer/historical-identity/historical-identity.test.cjs
          node --test tools/tests/windows-installer/upgrade-detection/upgrade-detection.test.cjs
          node --test tools/tests/windows-installer/upgrade-preflight/preflight.test.cjs
          node tools/tests/windows-installer/contract.cjs
      - name: Install historical beta.1 and capture exact post-install identity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $taskOutput='C:/KSESSION-B4-T1A-EVIDENCE/historical-identity-evidence.json'
          & tools/windows-installer/historical-identity/invoke.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -OutputFile $taskOutput
          if ($LASTEXITCODE -ne 0) { throw 'Historical identity capture blocked' }
          "KSESSION_HISTORICAL_EVIDENCE=$taskOutput" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Non-sensitive historical identity summary
        if: success()
        shell: pwsh
        run: |
          $e=Get-Content -LiteralPath $env:KSESSION_HISTORICAL_EVIDENCE -Raw|ConvertFrom-Json
          @(
            '## Historical beta.1 identity evidence',
            '',
            ('- Status: '+$e.status),
            ('- Profile: '+$e.profile.id),
            ('- Run / Artifact: '+$e.source.runId+' / '+$e.source.artifactId),
            ('- Setup SHA-256: `'+$e.source.setupSha256+'`'),
            ('- T1 single-policy validation: '+$e.verification.t1SinglePolicy),
            ('- Registry view: '+$e.verification.registryView),
            ('- Cleanup: PASS')
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: b4-historical-identity-evidence-${{ github.sha }}
          path: ${{ env.KSESSION_HISTORICAL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
